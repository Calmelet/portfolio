# Réglages du portfolio. Modifiez les quatre lignes ci-dessous, enregistrez,
# et le site se met à jour tout seul après la publication.
title: "Jules Calmelet"
description: "Étudiant en BTS SIO option SISR à ENSITECH. Réseaux, systèmes et réalisations professionnelles."
email: ""
linkedin: ""

lang: fr

# Chaque fichier déposé dans le dossier _projets devient une page du site.
collections:
  projets:
    output: true
    permalink: /projets/:name/

defaults:
  - scope:
      path: ""
      type: projets
    values:
      layout: projet

exclude:
  - README.md
  - LICENSE

# Publier aussi les projets dont la date est postérieure au jour de la publication
future: true

# Nom du dépôt GitHub. Adapter si le dépôt porte un autre nom.
baseurl: "/portfolio"
url: "https://calmelet.github.io"
